apiVersion: v1
kind: ResourceQuota
metadata:
  name: agentos-domain-capacity
spec:
  hard:
    count/persistentvolumeclaims: "16"
    count/pods: "16"
    count/services: "16"
    count/services.loadbalancers: "0"
    count/services.nodeports: "0"
    count/statefulsets.apps: "16"
    limits.cpu: "32"
    limits.memory: 64Gi
    requests.cpu: "16"
    requests.memory: 32Gi
    requests.storage: 320Gi
