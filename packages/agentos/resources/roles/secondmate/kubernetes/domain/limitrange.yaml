apiVersion: v1
kind: LimitRange
metadata:
  name: agentos-domain-workload-limits
spec:
  limits:
    - type: Container
      min:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: "4"
        memory: 8Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: "2"
        memory: 4Gi
    - type: PersistentVolumeClaim
      min:
        storage: 1Gi
      max:
        storage: 40Gi
