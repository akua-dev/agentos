apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentos-domain-beta
resources:
  - ../../../domain
patches:
  - target:
      version: v1
      kind: Namespace
      name: agentos-secondmate-domain
    patch: |-
      - op: replace
        path: /metadata/name
        value: agentos-domain-beta
      - op: replace
        path: /metadata/labels/agentos.akua.dev~1owner-agent-id
        value: 00000000-0000-4000-8000-00000000000b
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: agentos-secondmate-workload-manager-binding
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: agentos-domain-beta
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: agentos-secondmate
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/env/2/value
        value: 00000000-0000-4000-8000-00000000000b
      - op: replace
        path: /spec/template/spec/initContainers/1/env/2/value
        value: 00000000-0000-4000-8000-00000000000b
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: 00000000-0000-4000-8000-00000000000b
