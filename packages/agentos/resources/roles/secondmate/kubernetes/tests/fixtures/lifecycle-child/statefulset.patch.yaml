apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentos-crewmate
spec:
  template:
    spec:
      initContainers:
        - $patch: replace
      containers:
        - $patch: replace
        - name: crewmate
          image: registry.k8s.io/pause@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: agentos-egress-identity
              mountPath: /var/run/secrets/agentos-egress
              readOnly: true
      volumes:
        - $patch: replace
        - name: agentos-egress-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: agentos-egress-authz
                  expirationSeconds: 600
                  path: token
