apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentos-firstmate
spec:
  template:
    metadata:
      labels:
        agentos.akua.dev/ai-gateway-client: "true"
    spec:
      initContainers:
        - name: install-tools
        - name: prepare-home
          env:
            - name: AGENTOS_PI_PROVIDER_MODE
              value: ai-gateway
            - name: AI_GATEWAY_URL
              value: http://ai-gateway.agentos.svc.cluster.local:8787
            - name: AI_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-client
                  key: token
      containers:
        - name: agentos
          env:
            - name: AGENTOS_PI_PROVIDER_MODE
              value: ai-gateway
            - name: AI_GATEWAY_URL
              value: http://ai-gateway.agentos.svc.cluster.local:8787
            - name: AI_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-client
                  key: token
