apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentos-crewmate
spec:
  template:
    spec:
      initContainers:
        - name: install-tools
        - name: prepare-home
          env:
            - name: AGENTOS_CODEX_PROVIDER_MODE
              value: ai-gateway
            - name: AI_GATEWAY_URL
              value: http://127.0.0.1:8790
      containers:
        - name: crewmate
          env:
            - name: AGENTOS_CODEX_PROVIDER_MODE
              value: ai-gateway
            - name: AGENTOS_PROVIDER_CREDENTIAL_KIND
              value: ai_gateway
            - name: AI_GATEWAY_URL
              value: http://127.0.0.1:8790
