apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentos-crewmate
  labels:
    agentos.akua.dev/agent: crewmate
    agentos.akua.dev/agent-id: 00000000-0000-4000-8000-000000000003
    agentos.akua.dev/assignment-id: 00000000-0000-4000-8000-000000000005
    agentos.akua.dev/owner-agent-id: 00000000-0000-4000-8000-000000000002
    agentos.akua.dev/task-id: 00000000-0000-4000-8000-000000000004
    app.kubernetes.io/name: agentos-crewmate
spec:
  serviceName: agentos-crewmate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentos-crewmate
  template:
    metadata:
      annotations:
        agentos.akua.dev/container: crewmate
        agentos.akua.dev/herdr-session: agentos-crewmate
      labels:
        agentos.akua.dev/agent: crewmate
        agentos.akua.dev/agent-id: 00000000-0000-4000-8000-000000000003
        agentos.akua.dev/assignment-id: 00000000-0000-4000-8000-000000000005
        agentos.akua.dev/owner-agent-id: 00000000-0000-4000-8000-000000000002
        agentos.akua.dev/task-id: 00000000-0000-4000-8000-000000000004
        app.kubernetes.io/name: agentos-crewmate
    spec:
      automountServiceAccountToken: false
      serviceAccountName: agentos-crewmate
      initContainers:
        - name: install-tools
          workingDir: /opt/agentos/packages/agentos/resources/crewmates/default
          args:
            - install
            - --locked
            - node
            - gh
            - kubectl
            - github:ogulcancelik/herdr
            - github:kunchenguid/no-mistakes
            - github:kunchenguid/treehouse
            - npm:@openai/codex
            - npm:gh-axi
          env: &role-environment
            - name: HOME
              value: /home/agent
            - name: AGENTOS_RELEASE_ROOT
              value: /opt/agentos
            - name: AGENTOS_AGENT_CWD
              value: /opt/agentos/packages/agentos/resources/crewmates/default
            - name: AGENTOS_DISTRIBUTION_ROOT
              value: /opt/agentos/packages/agentos
            - name: AGENTOS_AGENT_ID
              value: 00000000-0000-4000-8000-000000000003
            - name: AGENTOS_AGENT_NAME
              value: crewmate
            - name: AGENTOS_AGENT_ROLE
              value: crewmate
            - name: AGENTOS_AI_RUNTIME
              value: codex
            - name: AGENTOS_AI_RUNTIME_VERSION
              value: 0.144.5
            - name: AGENTOS_ASSIGNMENT_ID
              value: 00000000-0000-4000-8000-000000000005
            - name: AGENTOS_BRIEF_PATH
              value: /home/agent/brief.md
            - name: AGENTOS_DATABASE_URL
              value: postgresql://runtime_crewmate@agentos-postgres-rw.agentos.svc.cluster.local:5432/agentos?sslmode=require
            - name: AGENTOS_PGPASS_SOURCE
              value: /var/run/secrets/agentos/pgpass
            - name: AGENTOS_TASK_ID
              value: 00000000-0000-4000-8000-000000000004
            - name: HERDR_CONFIG_PATH
              value: /home/agent/.config/herdr/config.toml
            - name: HERDR_SESSION
              value: agentos-crewmate
            - name: K8S_CONTAINER_NAME
              value: crewmate
            - name: MISE_SYSTEM_CONFIG_FILE
              value: /etc/mise/config.toml
            - name: MISE_GITHUB_GITHUB_ATTESTATIONS
              value: "false"
            - name: MISE_GITHUB_SLSA
              value: "false"
            - name: MISE_TRUSTED_CONFIG_PATHS
              value: /opt/agentos
            - name: PGPASSFILE
              value: /home/agent/.pgpass
            - name: PATH
              value: /home/agent/.local/share/mise/shims:/home/agent/.local/bin:/usr/local/bin:/usr/bin:/bin
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
        - name: prepare-home
          image: agentos:dev
          imagePullPolicy: Never
          workingDir: /opt/agentos/packages/agentos/resources/crewmates/default
          command:
            - mise
          args:
            - run
            - --skip-tools
            - crewmate:prepare
          env: *role-environment
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: database-credentials
              mountPath: /var/run/secrets/agentos
              readOnly: true
      containers:
        - name: agentos
          workingDir: /opt/agentos/packages/agentos/resources/crewmates/default
          command:
            - herdr
          args:
            - server
            - --session
            - agentos-crewmate
          env: *role-environment
          livenessProbe:
            exec:
              command:
                - herdr
                - status
                - --json
                - --session
                - agentos-crewmate
          readinessProbe:
            exec:
              command:
                - herdr
                - status
                - --json
                - --session
                - agentos-crewmate
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: database-credentials
          secret:
            defaultMode: 0440
            secretName: agentos-crewmate-postgres
