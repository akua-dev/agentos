apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - service.yaml
  - ../../../../../runtime/kubernetes/base
components:
  - ../../../../../runtime/kubernetes/observability
  - ../../../../../runtime/kubernetes/github-provider
patches:
  - path: statefulset.patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: agentos-agent
  - patch: |-
      - op: replace
        path: /metadata/name
        value: agentos-crewmate
      - op: replace
        path: /spec/template/spec/containers/0/name
        value: crewmate
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: agentos-agent
  - patch: |-
      - op: copy
        from: /spec/template/spec/containers/0/env
        path: /spec/template/spec/initContainers/1/env
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: agentos-agent
