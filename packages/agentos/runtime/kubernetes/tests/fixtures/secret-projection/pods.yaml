apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reader
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - sleep 3600
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: credential
          mountPath: /var/run/secrets/agentos
          readOnly: true
  volumes:
    - name: credential
      secret:
        secretName: managed-credential
        defaultMode: 0440
---
apiVersion: v1
kind: Pod
metadata:
  name: unrelated-reader
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reader
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - sleep 3600
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: credential
          mountPath: /var/run/secrets/agentos
          readOnly: true
  volumes:
    - name: credential
      secret:
        secretName: managed-credential
        defaultMode: 0440
