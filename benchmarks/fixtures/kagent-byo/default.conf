server {
  listen 8080;
  server_name _;
  access_log off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  location = /healthz {
    default_type text/plain;
    return 200 "ready\n";
  }

  location ~ ^/\.well-known/agent(?:-card)?\.json$ {
    default_type application/json;
    return 200 '{"name":"agentos_kagent_external","description":"Credential-free AgentOS Kagent interoperability fixture","url":"http://agentos-kagent-external.kagent-interop.svc.cluster.local:8080","version":"0.1.0","protocolVersion":"0.3.0","preferredTransport":"JSONRPC","capabilities":{"streaming":false,"pushNotifications":false,"stateTransitionHistory":true},"defaultInputModes":["text/plain"],"defaultOutputModes":["text/plain"],"skills":[{"id":"agentos-interop","name":"AgentOS interoperability marker","description":"Returns one frozen non-content marker","tags":["conformance"]}]}';
  }

  location / {
    limit_except POST {
      deny all;
    }
    default_type application/json;
    return 200 '{"jsonrpc":"2.0","id":"agentos-kagent-129","result":{"id":"task-agentos-kagent-129","contextId":"context-agentos-kagent-129","kind":"task","status":{"state":"completed","timestamp":"2026-08-01T00:00:00Z"},"artifacts":[{"artifactId":"artifact-agentos-kagent-129","name":"interop-marker","parts":[{"kind":"text","text":"agentos-kagent-interop-ok"}]}],"history":[]}}';
  }
}
