apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-a2a
  labels:
    app.kubernetes.io/name: agentgateway-a2a
    app.kubernetes.io/component: protocol-gateway
    app.kubernetes.io/part-of: agentos
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: agentos-a2a-tls
      allowedRoutes:
        namespaces:
          from: Same
