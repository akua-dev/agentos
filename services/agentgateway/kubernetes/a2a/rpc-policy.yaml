apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentos-a2a-rpc
  labels:
    app.kubernetes.io/name: agentgateway-a2a
    app.kubernetes.io/component: protocol-gateway
    app.kubernetes.io/part-of: agentos
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentos-a2a-rpc
  traffic:
    extAuth:
      backendRef:
        group: ""
        kind: Service
        name: agentos-a2a
        port: 8790
      failureMode: FailClosed
      forwardBody:
        maxSize: 16384
      http:
        path: '"/authorize"'
        allowedRequestHeaders:
          - authorization
          - a2a-version
          - content-type
        addRequestHeaders:
          x-agentos-original-method: request.method
          x-agentos-original-path: request.path
        allowedResponseHeaders:
          - x-agentos-a2a-verified-agent-id
