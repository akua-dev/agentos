apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentgateway-openai
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-openai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentgateway-openai
  ports:
    - name: openai
      port: 8788
      targetPort: gateway
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway-openai
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-openai
  template:
    metadata:
      labels:
        agentos.akua.dev/ai-gateway-upstream: "true"
      annotations:
        agentos.akua.dev/config-source: immutable-kustomize
    spec:
      automountServiceAccountToken: false
      serviceAccountName: agentgateway-openai
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway-openai
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway@sha256:efd79355b89094a8225a9db465d9a01dc656b377f0bab458761b935a13231d29
          imagePullPolicy: IfNotPresent
          args:
            - -f
            - /config/config.yaml
          ports:
            - name: gateway
              containerPort: 4000
              protocol: TCP
            - name: metrics
              containerPort: 15020
              protocol: TCP
            - name: native-ready
              containerPort: 15021
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: native-ready
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz/ready
              port: native-ready
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 15022
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: semantic-readiness
          image: agentos:dev
          imagePullPolicy: Never
          command:
            - agentos-agentgateway-readiness
          ports:
            - name: semantic-ready
              containerPort: 15022
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: semantic-ready
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: semantic-ready
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: semantic-ready
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: agentgateway-openai-config
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentgateway-openai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-openai
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-openai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-openai
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentos
          podSelector:
            matchLabels:
              agentos.akua.dev/agentgateway-client: "true"
              app.kubernetes.io/name: agentos-crewmate
        - namespaceSelector:
            matchLabels:
              agentos.akua.dev/managed-by: agentos-firstmate
          podSelector:
            matchLabels:
              agentos.akua.dev/agentgateway-client: "true"
              app.kubernetes.io/name: agentos-crewmate
      ports:
        - protocol: TCP
          port: 4000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentos-egress-authz
      ports:
        - protocol: TCP
          port: 8787
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
      ports:
        - protocol: TCP
          port: 8787
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentos-otel-collector
      ports:
        - protocol: TCP
          port: 4317
