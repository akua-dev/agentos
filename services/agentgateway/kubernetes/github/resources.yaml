apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentgateway-github
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-github
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentgateway-github
  ports:
    - name: github
      port: 443
      targetPort: gateway
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway-github
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-github
  template:
    metadata:
      labels:
        agentos.akua.dev/github-broker-upstream: "true"
      annotations:
        agentos.akua.dev/config-source: immutable-kustomize
    spec:
      automountServiceAccountToken: false
      serviceAccountName: agentgateway-github
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway-github
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway@sha256:efd79355b89094a8225a9db465d9a01dc656b377f0bab458761b935a13231d29
          imagePullPolicy: IfNotPresent
          args:
            - -f
            - /config/config.yaml
          ports:
            - name: gateway
              containerPort: 4443
              protocol: TCP
            - name: metrics
              containerPort: 15020
              protocol: TCP
            - name: native-ready
              containerPort: 15021
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: native-ready
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz/ready
              port: native-ready
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 15022
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: github-tls
              mountPath: /var/run/secrets/agentos-github-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: semantic-readiness
          image: agentos:dev
          imagePullPolicy: Never
          command:
            - agentos-agentgateway-readiness
          ports:
            - name: semantic-ready
              containerPort: 15022
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: semantic-ready
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: semantic-ready
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: semantic-ready
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: config
          configMap:
            name: agentgateway-github-config
            defaultMode: 0444
        - name: github-tls
          secret:
            secretName: agentos-github-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentgateway-github
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-github
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-github
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-github
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentos
          podSelector:
            matchExpressions:
              - key: agentos.akua.dev/agent
                operator: Exists
        - namespaceSelector:
            matchLabels:
              agentos.akua.dev/managed-by: agentos-firstmate
          podSelector:
            matchExpressions:
              - key: agentos.akua.dev/agent
                operator: Exists
      ports:
        - protocol: TCP
          port: 4443
