apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-broker
  labels:
    app.kubernetes.io/name: github-broker
    app.kubernetes.io/component: provider-adapter
    app.kubernetes.io/part-of: agentos
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: github-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-broker
        app.kubernetes.io/component: provider-adapter
        app.kubernetes.io/part-of: agentos
        agentos.akua.dev/credential-domain: github
        agentos.akua.dev/otel-client: "true"
    spec:
      automountServiceAccountToken: false
      serviceAccountName: github-broker
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: github-broker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github-broker
          image: agentos:dev
          imagePullPolicy: Never
          command:
            - agentos-github-broker
          env:
            - name: K8S_CONTAINER_NAME
              value: github-broker
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: agentos-github-broker
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=agentos,deployment.environment.name=default,agentos.fleet.name=default,k8s.cluster.name=agentos,k8s.namespace.name=$(K8S_NAMESPACE),k8s.pod.name=$(K8S_POD_NAME),k8s.container.name=$(K8S_CONTAINER_NAME),k8s.workload.name=github-broker
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://agentos-otel-collector.agentos.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_COMPRESSION
              value: gzip
            - name: OTEL_EXPORTER_OTLP_TIMEOUT
              value: "5000"
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1"
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_BSP_MAX_EXPORT_BATCH_SIZE
              value: "512"
            - name: OTEL_BLRP_MAX_EXPORT_BATCH_SIZE
              value: "512"
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: agentos-github-app
                  key: app-id
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: agentos-github-app
                  key: installation-id
            - name: GITHUB_APP_INSTALLATION_OWNER
              valueFrom:
                secretKeyRef:
                  name: agentos-github-app
                  key: installation-owner
            - name: GITHUB_APP_PRIVATE_KEY_FILE
              value: /var/run/secrets/agentos-github-app/private-key.pem
            - name: GITHUB_BROKER_LISTEN_HOST
              value: 0.0.0.0
            - name: GITHUB_BROKER_LISTEN_PORT
              value: "8789"
            - name: AGENTOS_PROVIDER_BUDGET_SETTLEMENT_BASE_URL
              value: http://agentos-egress-authz.agentos.svc.cluster.local:9001
            - name: AGENTOS_PROVIDER_BUDGET_SETTLEMENT_TOKEN_FILE
              value: /var/run/secrets/agentos-budget-settlement/token
          ports:
            - name: http
              containerPort: 8789
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: github-app
              mountPath: /var/run/secrets/agentos-github-app
              readOnly: true
            - name: budget-settlement
              mountPath: /var/run/secrets/agentos-budget-settlement
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: github-app
          secret:
            secretName: agentos-github-app
            defaultMode: 0440
            items:
              - key: private-key.pem
                path: private-key.pem
        - name: budget-settlement
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: agentos-provider-budget-settlement
                  expirationSeconds: 600
                  path: token
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
