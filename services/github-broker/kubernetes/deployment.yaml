apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-broker
  labels:
    app.kubernetes.io/name: github-broker
    app.kubernetes.io/component: provider-adapter
    app.kubernetes.io/part-of: agentos
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: github-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-broker
        app.kubernetes.io/component: provider-adapter
        app.kubernetes.io/part-of: agentos
        agentos.akua.dev/credential-domain: github
    spec:
      automountServiceAccountToken: false
      serviceAccountName: github-broker
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github-broker
          image: agentos:dev
          imagePullPolicy: Never
          command:
            - agentos-github-broker
          env:
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: agentos-github-app
                  key: app-id
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: agentos-github-app
                  key: installation-id
            - name: GITHUB_APP_INSTALLATION_OWNER
              valueFrom:
                secretKeyRef:
                  name: agentos-github-app
                  key: installation-owner
            - name: GITHUB_APP_PRIVATE_KEY_FILE
              value: /var/run/secrets/agentos-github-app/private-key.pem
            - name: GITHUB_BROKER_LISTEN_HOST
              value: 0.0.0.0
            - name: GITHUB_BROKER_LISTEN_PORT
              value: "8789"
            - name: AGENTOS_PROVIDER_BUDGET_SETTLEMENT_BASE_URL
              value: http://agentos-egress-authz.agentos.svc.cluster.local:9001
            - name: AGENTOS_PROVIDER_BUDGET_SETTLEMENT_TOKEN_FILE
              value: /var/run/secrets/agentos-budget-settlement/token
          ports:
            - name: http
              containerPort: 8789
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: github-app
              mountPath: /var/run/secrets/agentos-github-app
              readOnly: true
            - name: budget-settlement
              mountPath: /var/run/secrets/agentos-budget-settlement
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: github-app
          secret:
            secretName: agentos-github-app
            defaultMode: 0440
            items:
              - key: private-key.pem
                path: private-key.pem
        - name: budget-settlement
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: agentos-provider-budget-settlement
                  expirationSeconds: 600
                  path: token
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
