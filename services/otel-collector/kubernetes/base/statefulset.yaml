apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentos-otel-collector
  labels:
    app.kubernetes.io/name: agentos-otel-collector
    app.kubernetes.io/part-of: agentos
spec:
  serviceName: agentos-otel-collector
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: agentos-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentos-otel-collector
        app.kubernetes.io/part-of: agentos
    spec:
      serviceAccountName: agentos-otel-collector
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
          imagePullPolicy: IfNotPresent
          args:
            - --config=file:/etc/otelcol/collector.yaml
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AGENTOS_OTEL_TRACE_SAMPLING_PERCENTAGE
              value: "100"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: agentos.fleet.name=default,deployment.environment.name=development,agentos.telemetry.contract.version=1,k8s.cluster.name=agentos
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: storage
              mountPath: /var/lib/otelcol
      volumes:
        - name: config
          configMap:
            name: agentos-otel-collector
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
