apiVersion: v1
kind: Service
metadata:
  name: agentos-otel-collector
  labels:
    app.kubernetes.io/name: agentos-otel-collector
    app.kubernetes.io/part-of: agentos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentos-otel-collector
  ports:
    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: otlp-http
    - name: metrics
      protocol: TCP
      port: 8888
      targetPort: metrics
    - name: health
      protocol: TCP
      port: 13133
      targetPort: health
