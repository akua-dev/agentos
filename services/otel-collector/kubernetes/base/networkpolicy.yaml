apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentos-otel-collector
  labels:
    app.kubernetes.io/name: agentos-otel-collector
    app.kubernetes.io/part-of: agentos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentos-otel-collector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              agentos.akua.dev/fleet: default
          podSelector:
            matchLabels:
              agentos.akua.dev/otel-client: "true"
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
