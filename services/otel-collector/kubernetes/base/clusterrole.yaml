apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentos-otel-collector
  labels:
    app.kubernetes.io/name: agentos-otel-collector
    app.kubernetes.io/part-of: agentos
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - watch
