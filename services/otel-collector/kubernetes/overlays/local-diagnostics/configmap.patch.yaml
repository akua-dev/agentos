apiVersion: v1
kind: ConfigMap
metadata:
  name: agentos-otel-collector
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        path: /healthz
        response_body:
          healthy: '{"status":"ok"}'
          unhealthy: '{"status":"unavailable"}'
      pprof:
        endpoint: 127.0.0.1:1777
      file_storage/queue:
        directory: /var/lib/otelcol/storage
        create_directory: true
        timeout: 1s
        max_size: 536870912
        fsync: true
        recreate: true
        compaction:
          directory: /var/lib/otelcol/storage
          on_start: true
          on_rebound: true
          cleanup_on_start: true
          rebound_needed_threshold_mib: 256
          rebound_trigger_threshold_mib: 64
          check_interval: 5s

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 8
          http:
            endpoint: 0.0.0.0:4318
            max_request_body_size: 8388608
            read_timeout: 10s
            read_header_timeout: 5s

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        pod_association:
          - sources:
              - from: connection
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.replicaset.name
            - k8s.pod.name
            - k8s.container.name
            - service.namespace
            - service.name
            - service.version
          labels:
            - tag_name: agentos.ai.runtime
              key: agentos.akua.dev/ai-runtime
              from: pod
            - tag_name: agentos.ai.runtime.version
              key: agentos.akua.dev/ai-runtime-version
              from: pod
      resource_detection/fleet:
        detectors:
          - env
        timeout: 2s
        override: false
      transform/codex_native:
        error_mode: ignore
        trace_statements:
          - statements:
              - >-
                set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.statefulset.name"]) where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.statefulset.name"] != nil
              - >-
                set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.deployment.name"] != nil
              - >-
                set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.daemonset.name"]) where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.daemonset.name"] != nil
        metric_statements:
          - statements:
              - >-
                set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.statefulset.name"]) where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.statefulset.name"] != nil
              - >-
                set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.deployment.name"] != nil
              - >-
                set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.daemonset.name"]) where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.daemonset.name"] != nil
          - statements:
              - >-
                set(datapoint.attributes["agentos.ai.request.kind"], "main") where metric.name == "codex.api_request" or metric.name == "codex.api_request.duration_ms"
              - >-
                set(datapoint.attributes["agentos.ai.status_class"], "success") where (metric.name == "codex.api_request" or metric.name == "codex.api_request.duration_ms") and datapoint.attributes["success"] == "true"
              - >-
                set(datapoint.attributes["agentos.ai.status_class"], "client_error") where (metric.name == "codex.api_request" or metric.name == "codex.api_request.duration_ms") and IsMatch(datapoint.attributes["status"], "^4[0-9][0-9]$")
              - >-
                set(datapoint.attributes["agentos.ai.status_class"], "server_error") where (metric.name == "codex.api_request" or metric.name == "codex.api_request.duration_ms") and IsMatch(datapoint.attributes["status"], "^5[0-9][0-9]$")
              - >-
                set(datapoint.attributes["agentos.ai.status_class"], "error") where (metric.name == "codex.api_request" or metric.name == "codex.api_request.duration_ms") and datapoint.attributes["success"] != "true" and not IsMatch(datapoint.attributes["status"], "^[45][0-9][0-9]$")
              - >-
                set(datapoint.attributes["agentos.ai.error.class"], "none") where (metric.name == "codex.api_request" or metric.name == "codex.api_request.duration_ms") and datapoint.attributes["success"] == "true"
              - >-
                set(datapoint.attributes["agentos.ai.error.class"], "authentication") where (metric.name == "codex.api_request" or metric.name == "codex.api_request.duration_ms") and (datapoint.attributes["status"] == "401" or datapoint.attributes["status"] == "403")
              - >-
                set(datapoint.attributes["agentos.ai.error.class"], "rate_limit") where (metric.name == "codex.api_request" or metric.name == "codex.api_request.duration_ms") and datapoint.attributes["status"] == "429"
              - >-
                set(datapoint.attributes["agentos.ai.error.class"], "overload") where (metric.name == "codex.api_request" or metric.name == "codex.api_request.duration_ms") and (datapoint.attributes["status"] == "502" or datapoint.attributes["status"] == "503" or datapoint.attributes["status"] == "529")
              - >-
                set(datapoint.attributes["agentos.ai.error.class"], "unavailable") where (metric.name == "codex.api_request" or metric.name == "codex.api_request.duration_ms") and IsMatch(datapoint.attributes["status"], "^5[0-9][0-9]$") and datapoint.attributes["status"] != "502" and datapoint.attributes["status"] != "503" and datapoint.attributes["status"] != "529"
              - >-
                set(datapoint.attributes["agentos.ai.error.class"], "unknown") where (metric.name == "codex.api_request" or metric.name == "codex.api_request.duration_ms") and datapoint.attributes["success"] != "true" and datapoint.attributes["agentos.ai.error.class"] == nil
        log_statements:
          - statements:
              - >-
                set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.statefulset.name"]) where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.statefulset.name"] != nil
              - >-
                set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.deployment.name"] != nil
              - >-
                set(resource.attributes["k8s.workload.name"], resource.attributes["k8s.daemonset.name"]) where resource.attributes["k8s.workload.name"] == nil and resource.attributes["k8s.daemonset.name"] != nil
          - statements:
              - >-
                set(log.attributes["agentos.ai.request.kind"], "main") where log.attributes["event.name"] == "codex.api_request"
              - >-
                set(log.attributes["agentos.ai.status_class"], "error") where log.attributes["event.name"] == "codex.api_request"
              - >-
                set(log.attributes["agentos.ai.status_class"], "success") where log.attributes["event.name"] == "codex.api_request" and log.attributes["http.response.status_code"] >= 200 and log.attributes["http.response.status_code"] < 400 and log.attributes["error.message"] == nil
              - >-
                set(log.attributes["agentos.ai.status_class"], "client_error") where log.attributes["event.name"] == "codex.api_request" and log.attributes["http.response.status_code"] >= 400 and log.attributes["http.response.status_code"] < 500
              - >-
                set(log.attributes["agentos.ai.status_class"], "server_error") where log.attributes["event.name"] == "codex.api_request" and log.attributes["http.response.status_code"] >= 500 and log.attributes["http.response.status_code"] < 600
              - >-
                set(log.attributes["agentos.ai.error.class"], "unknown") where log.attributes["event.name"] == "codex.api_request"
              - >-
                set(log.attributes["agentos.ai.error.class"], "none") where log.attributes["event.name"] == "codex.api_request" and log.attributes["error.message"] == nil and log.attributes["http.response.status_code"] < 400
              - >-
                set(log.attributes["agentos.ai.error.class"], "authentication") where log.attributes["event.name"] == "codex.api_request" and (log.attributes["http.response.status_code"] == 401 or log.attributes["http.response.status_code"] == 403)
              - >-
                set(log.attributes["agentos.ai.error.class"], "rate_limit") where log.attributes["event.name"] == "codex.api_request" and log.attributes["http.response.status_code"] == 429
              - >-
                set(log.attributes["agentos.ai.error.class"], "overload") where log.attributes["event.name"] == "codex.api_request" and (log.attributes["http.response.status_code"] == 502 or log.attributes["http.response.status_code"] == 503 or log.attributes["http.response.status_code"] == 529)
              - >-
                set(log.attributes["agentos.ai.error.class"], "unavailable") where log.attributes["event.name"] == "codex.api_request" and log.attributes["http.response.status_code"] >= 500 and log.attributes["http.response.status_code"] < 600 and log.attributes["http.response.status_code"] != 502 and log.attributes["http.response.status_code"] != 503 and log.attributes["http.response.status_code"] != 529
              - >-
                set(log.attributes["agentos.ai.provider.request_id"], log.attributes["auth.request_id"]) where log.attributes["event.name"] == "codex.api_request" and log.attributes["auth.request_id"] != nil
              - >-
                truncate_all(log.attributes, 128) where log.attributes["event.name"] == "codex.api_request"
      probabilistic_sampler/fleet:
        mode: proportional
        sampling_percentage: ${env:AGENTOS_OTEL_TRACE_SAMPLING_PERCENTAGE}
        fail_closed: true
        sampling_precision: 4
      resource/privacy:
        attributes:
          - key: k8s.pod.uid
            action: delete
          - key: process.command_args
            action: delete
          - key: process.command_line
            action: delete
          - key: process.environment
            action: delete
          - key: user.email
            action: delete
          - key: enduser.id
            action: delete
          - key: authorization
            action: delete
          - key: cookie
            action: delete
          - key: http.request.body
            action: delete
          - key: http.response.body
            action: delete
          - key: http.request.header.authorization
            action: delete
          - key: http.request.header.cookie
            action: delete
          - key: http.response.header.set_cookie
            action: delete
          - key: gen_ai.prompt
            action: delete
          - key: gen_ai.completion
            action: delete
          - key: gen_ai.input.messages
            action: delete
          - key: gen_ai.output.messages
            action: delete
          - key: tool.arguments
            action: delete
          - key: tool.result
            action: delete
          - key: error.message
            action: delete
          - key: exception.message
            action: delete
          - key: exception.stacktrace
            action: delete
          - key: provider.account.id
            action: delete
          - key: provider.account.email
            action: delete
          - key: db.query.text
            action: delete
          - key: db.statement
            action: delete
          - key: gen_ai.system_instructions
            action: delete
          - key: agentos.assignment.brief
            action: delete
          - key: agentos.inbox.body
            action: delete
          - key: agentos.memory.body
            action: delete
          - key: agentos.memory.embedding
            action: delete
          - key: agentos.memory.query
            action: delete
          - key: agentos.memory.snippet
            action: delete
          - key: agentos.provider.credential
            action: delete
          - key: agentos.provider.identity
            action: delete
          - key: agentos.provider.resource_id
            action: delete
          - key: agentos.repository.name
            action: delete
          - key: agentos.session.transcript
            action: delete
          - key: agentos.tool.arguments
            action: delete
          - key: agentos.tool.result
            action: delete
      attributes/privacy:
        actions:
          - key: authorization
            action: delete
          - key: cookie
            action: delete
          - key: http.request.body
            action: delete
          - key: http.response.body
            action: delete
          - key: http.request.header.authorization
            action: delete
          - key: http.request.header.cookie
            action: delete
          - key: http.response.header.set_cookie
            action: delete
          - key: gen_ai.prompt
            action: delete
          - key: gen_ai.completion
            action: delete
          - key: gen_ai.input.messages
            action: delete
          - key: gen_ai.output.messages
            action: delete
          - key: tool.arguments
            action: delete
          - key: tool.result
            action: delete
          - key: error.message
            action: delete
          - key: exception.message
            action: delete
          - key: exception.stacktrace
            action: delete
          - key: provider.account.id
            action: delete
          - key: provider.account.email
            action: delete
          - key: db.query.text
            action: delete
          - key: db.statement
            action: delete
          - key: gen_ai.system_instructions
            action: delete
          - key: agentos.assignment.brief
            action: delete
          - key: agentos.inbox.body
            action: delete
          - key: agentos.memory.body
            action: delete
          - key: agentos.memory.embedding
            action: delete
          - key: agentos.memory.query
            action: delete
          - key: agentos.memory.snippet
            action: delete
          - key: agentos.provider.credential
            action: delete
          - key: agentos.provider.identity
            action: delete
          - key: agentos.provider.resource_id
            action: delete
          - key: agentos.repository.name
            action: delete
          - key: agentos.session.transcript
