        metric_statements:
          - statements:
              - >-
                keep_keys(resource.attributes, ["agentos.ai.runtime", "agentos.ai.runtime.version", "agentos.fleet.name", "agentos.telemetry.contract.version", "deployment.environment.name", "k8s.cluster.name", "k8s.container.name", "k8s.namespace.name", "k8s.pod.name", "k8s.workload.name", "service.name", "service.namespace", "service.version"])
          - statements:
              - delete_matching_keys(scope.attributes, ".*")
          - statements:
              - >-
                keep_keys(datapoint.attributes, ["agentos.access.adapter", "agentos.access.credential.outcome", "agentos.access.decision", "agentos.access.dependency", "agentos.access.operation", "agentos.access.provider", "agentos.access.provider.outcome", "agentos.access.reason", "agentos.access.route", "agentos.ai.budget.state", "agentos.ai.compaction.path", "agentos.ai.cost.source", "agentos.ai.error.class", "agentos.ai.model.family", "agentos.ai.quota.outcome", "agentos.ai.quota.stale", "agentos.ai.request.kind", "agentos.ai.route", "agentos.ai.route.operation", "agentos.ai.runtime", "agentos.ai.status_class", "agentos.ai.stream.outcome", "agentos.ai.token.type", "agentos.memory.degradation.class", "agentos.memory.index.state", "agentos.memory.method", "agentos.memory.operation", "agentos.memory.outcome", "agentos.protocol.fallback", "agentos.protocol.name", "agentos.protocol.operation", "agentos.protocol.outcome", "agentos.readiness.component", "agentos.readiness.outcome", "agentos.resilience.cause", "agentos.resilience.evidence", "agentos.resilience.outcome", "agentos.resilience.phase", "agentos.resilience.recovery", "agentos.resilience.source", "agentos.telemetry.outcome", "agentos.telemetry.reason", "agentos.telemetry.signal", "agentos.telemetry.stage", "agentos.topology.action", "agentos.topology.reason"])
          - statements:
              - delete_matching_keys(exemplar.filtered_attributes, ".*")
        log_statements:
          - statements:
              - >-
                keep_keys(resource.attributes, ["agentos.ai.runtime", "agentos.ai.runtime.version", "agentos.fleet.name", "agentos.telemetry.contract.version", "deployment.environment.name", "k8s.cluster.name", "k8s.container.name", "k8s.namespace.name", "k8s.pod.name", "k8s.workload.name", "service.name", "service.namespace", "service.version"])
