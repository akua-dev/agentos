                keep_keys(log.attributes, ["agentos.access.credential.outcome", "agentos.access.decision", "agentos.access.dependency", "agentos.access.operation", "agentos.access.reason", "agentos.ai.compaction.path", "agentos.ai.error.class", "agentos.ai.operation.id", "agentos.ai.provider.request_id", "agentos.ai.request.attempt_id", "agentos.ai.request.kind", "agentos.ai.route", "agentos.ai.runtime", "agentos.ai.status_class", "agentos.ai.stream.outcome", "agentos.authz.decision_ref", "agentos.authz.profile_id", "agentos.authz.profile_version", "agentos.identity.agent_id", "agentos.identity.assignment_id", "agentos.memory.degradation.class", "agentos.memory.index.state", "agentos.memory.index.version", "agentos.memory.method", "agentos.memory.operation", "agentos.memory.outcome", "agentos.memory.topic_id", "agentos.protocol.fallback", "agentos.protocol.name", "agentos.protocol.operation", "agentos.protocol.outcome", "agentos.readiness.component", "agentos.readiness.outcome", "agentos.resilience.cause", "agentos.resilience.evidence", "agentos.resilience.operation.id", "agentos.resilience.outcome", "agentos.resilience.phase", "agentos.resilience.protocol.id", "agentos.resilience.recovery", "agentos.resilience.source", "agentos.resilience.topology.proposal_id", "agentos.telemetry.contract.version", "agentos.telemetry.outcome", "agentos.telemetry.reason", "agentos.telemetry.signal", "agentos.telemetry.stage", "agentos.topology.action", "agentos.topology.reason", "http.response.status_code"])
          - statements:
              - set(log.body, "")
      batch:
        send_batch_size: 512
        send_batch_max_size: 1024
        timeout: 1s

    exporters:
      otlp_http/remote:
        endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
        compression: gzip
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
        sending_queue:
          enabled: true
          num_consumers: 4
          sizer: requests
          queue_size: 2048
          wait_for_result: false
          block_on_overflow: false
          storage: file_storage/queue
      file/local:
        path: /var/lib/otelcol-diagnostics/telemetry
        format: proto
        rotation:
          max_megabytes: 32
          max_backups: 8
          max_days: 1
          localtime: false

    service:
      extensions:
        - health_check
        - pprof
        - file_storage/queue
      telemetry:
        logs:
          level: info
          encoding: json
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
