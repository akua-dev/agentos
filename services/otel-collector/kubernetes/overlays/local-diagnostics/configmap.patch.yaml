          - key: agentos.resilience.operation.id
            action: delete
          - key: agentos.resilience.pod.uid
            action: delete
          - key: agentos.resilience.protocol.id
            action: delete
          - key: agentos.resilience.pvc.uid
            action: delete
          - key: agentos.resilience.session.id
            action: delete
          - key: agentos.resilience.topology.proposal_id
            action: delete
          - key: agentos.resilience.workload.overlay_digest
            action: delete
          - key: agentos.resilience.workload.render_digest
            action: delete
          - key: agentos.resilience.workload.spec_digest
            action: delete
          - key: agentos.runtime.session.id
            action: delete
          - key: agentos.trace.id
            action: delete
      transform/contract_allowlist:
        error_mode: propagate
        trace_statements:
          - statements:
              - >-
                keep_keys(resource.attributes, ["agentos.ai.runtime", "agentos.ai.runtime.version", "agentos.fleet.name", "agentos.telemetry.contract.version", "deployment.environment.name", "k8s.cluster.name", "k8s.container.name", "k8s.namespace.name", "k8s.pod.name", "k8s.workload.name", "service.name", "service.namespace", "service.version"])
          - statements:
              - delete_matching_keys(scope.attributes, ".*")
          - statements:
              - >-
                keep_keys(span.attributes, ["agentos.access.adapter", "agentos.access.cache.result", "agentos.access.credential.outcome", "agentos.access.decision", "agentos.access.dependency", "agentos.access.operation", "agentos.access.provider", "agentos.access.provider.outcome", "agentos.access.reason", "agentos.access.route", "agentos.ai.budget.state", "agentos.ai.compaction.path", "agentos.ai.cost.source", "agentos.ai.error.class", "agentos.ai.model.family", "agentos.ai.operation.id", "agentos.ai.provider.family", "agentos.ai.provider.request_id", "agentos.ai.quota.outcome", "agentos.ai.quota.stale", "agentos.ai.request.attempt_id", "agentos.ai.request.kind", "agentos.ai.retry.count", "agentos.ai.route", "agentos.ai.route.operation", "agentos.ai.route.slot", "agentos.ai.runtime", "agentos.ai.runtime.version", "agentos.ai.session.state", "agentos.ai.status_class", "agentos.ai.stream.bytes", "agentos.ai.stream.chunks", "agentos.ai.stream.mode", "agentos.ai.stream.outcome", "agentos.ai.token.type", "agentos.ai.usage.input_tokens", "agentos.ai.usage.output_tokens", "agentos.authz.decision_ref", "agentos.authz.profile_id", "agentos.authz.profile_version", "agentos.authz.rate_class", "agentos.identity.agent_id", "agentos.identity.assignment_id", "agentos.identity.task_id", "agentos.memory.degradation.class", "agentos.memory.index.state", "agentos.memory.index.version", "agentos.memory.method", "agentos.memory.operation", "agentos.memory.outcome", "agentos.memory.topic_id", "agentos.operation.id", "agentos.protocol.fallback", "agentos.protocol.name", "agentos.protocol.operation", "agentos.protocol.outcome", "agentos.readiness.component", "agentos.readiness.outcome", "agentos.request.id", "agentos.resilience.attempt", "agentos.resilience.cause", "agentos.resilience.evidence", "agentos.resilience.failure.class", "agentos.resilience.journal.phase", "agentos.resilience.operation.id", "agentos.resilience.outcome", "agentos.resilience.phase", "agentos.resilience.pod.uid", "agentos.resilience.protocol", "agentos.resilience.protocol.id", "agentos.resilience.pvc.uid", "agentos.resilience.recovery", "agentos.resilience.runtime.action", "agentos.resilience.session.id", "agentos.resilience.source", "agentos.resilience.topology.action", "agentos.resilience.topology.proposal_id", "agentos.resilience.topology.reason", "agentos.resilience.workload.overlay_digest", "agentos.resilience.workload.profile", "agentos.resilience.workload.render_digest", "agentos.resilience.workload.spec_digest", "agentos.resilience.workload.spec_version", "agentos.runtime.session.id", "agentos.telemetry.contract.version", "agentos.telemetry.outcome", "agentos.telemetry.reason", "agentos.telemetry.signal", "agentos.telemetry.stage", "agentos.topology.action", "agentos.topology.reason", "agentos.trace.id", "http.response.status_code"])
          - statements:
