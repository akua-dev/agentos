      attributes/metric_cardinality:
        actions:
          - key: agentos.ai.operation.id
            action: delete
          - key: agentos.ai.provider.request_id
            action: delete
          - key: agentos.ai.request.attempt_id
            action: delete
          - key: agentos.ai.route.slot
            action: delete
          - key: agentos.authz.decision_ref
            action: delete
          - key: agentos.authz.profile_id
