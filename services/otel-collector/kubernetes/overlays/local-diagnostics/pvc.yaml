apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentos-otel-diagnostics
  labels:
    app.kubernetes.io/name: agentos-otel-collector
    app.kubernetes.io/part-of: agentos
    agentos.akua.dev/retention: local-diagnostics
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
