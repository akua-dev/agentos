apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentos-otel-collector
spec:
  template:
    spec:
      containers:
        - name: collector
          volumeMounts:
            - name: diagnostics
              mountPath: /var/lib/otelcol-diagnostics
      volumes:
        - name: diagnostics
          persistentVolumeClaim:
            claimName: agentos-otel-diagnostics
