apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ai-gateway
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/component: ai-gateway
    app.kubernetes.io/part-of: agentos
spec:
  replicas: 1
  serviceName: ai-gateway
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  template:
    metadata:
      labels:
        agentos.akua.dev/otel-client: "true"
        app.kubernetes.io/name: ai-gateway
        app.kubernetes.io/component: ai-gateway
        app.kubernetes.io/part-of: agentos
    spec:
      automountServiceAccountToken: false
      serviceAccountName: ai-gateway
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: state-permissions
          image: agentos:dev
          imagePullPolicy: Never
          command:
            - bun
          args:
            - -e
            - 'const { chmod, chown } = await import("node:fs/promises"); const path = "/var/lib/ai-gateway"; await chown(path, 0, 0); await chmod(path, 0o700); await chown(path, 1000, 1000);'
          volumeMounts:
            - name: state
              mountPath: /var/lib/ai-gateway
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
      containers:
        - name: ai-gateway
          image: agentos:dev
          imagePullPolicy: Never
          command:
            - ai-gateway
          args:
            - serve
          env:
            - name: HOME
              value: /var/lib/ai-gateway/home
            - name: K8S_CONTAINER_NAME
              value: ai-gateway
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AGENTOS_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: OTEL_SERVICE_NAME
              value: agentos-ai-gateway
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=agentos,service.version=$(AGENTOS_VERSION),deployment.environment.name=default,agentos.fleet.name=default,k8s.cluster.name=agentos,k8s.namespace.name=$(K8S_NAMESPACE),k8s.pod.name=$(K8S_POD_NAME),k8s.container.name=$(K8S_CONTAINER_NAME),k8s.workload.name=ai-gateway
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://agentos-otel-collector.agentos.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_COMPRESSION
              value: gzip
            - name: OTEL_EXPORTER_OTLP_TIMEOUT
              value: "5000"
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1"
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_BSP_MAX_EXPORT_BATCH_SIZE
              value: "512"
            - name: OTEL_BLRP_MAX_EXPORT_BATCH_SIZE
              value: "512"
            - name: MISE_DATA_DIR
              value: /opt/mise
            - name: MISE_SYSTEM_CONFIG_FILE
              value: /etc/mise/config.toml
            - name: MISE_TRUSTED_CONFIG_PATHS
              value: /opt/agentos
            - name: AI_GATEWAY_STATE_DIR
              value: /var/lib/ai-gateway
            - name: AI_GATEWAY_CLIENT_AUTH_MODE
              value: workload_identity
            - name: AGENTOS_PROVIDER_BUDGET_SETTLEMENT_BASE_URL
              value: http://agentos-egress-authz.agentos.svc.cluster.local:9001
            - name: AGENTOS_PROVIDER_BUDGET_SETTLEMENT_TOKEN_FILE
              value: /var/run/secrets/agentos-budget-settlement/token
            - name: AI_GATEWAY_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-operator
                  key: token
          ports:
            - name: http
              protocol: TCP
              containerPort: 8787
          volumeMounts:
            - name: state
              mountPath: /var/lib/ai-gateway
            - name: budget-settlement
              mountPath: /var/run/secrets/agentos-budget-settlement
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: budget-settlement
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: agentos-provider-budget-settlement
                  expirationSeconds: 600
                  path: token
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
