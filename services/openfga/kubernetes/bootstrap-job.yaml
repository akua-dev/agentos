apiVersion: batch/v1
kind: Job
metadata:
  name: openfga-bootstrap-agentos-access-v1
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentos
    agentos.akua.dev/model-version: agentos-access-v1
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfga-bootstrap
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: agentos
        agentos.akua.dev/openfga-client: "true"
        agentos.akua.dev/model-version: agentos-access-v1
    spec:
      automountServiceAccountToken: true
      serviceAccountName: openfga-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: agentos:dev
          imagePullPolicy: Never
          command:
            - agentos-openfga-bootstrap
          env:
            - name: OPENFGA_BASE_URL
              value: http://openfga-bootstrap.agentos.svc.cluster.local:8080
            - name: OPENFGA_PRESHARED_KEY_FILE
              value: /var/run/secrets/agentos-openfga/preshared-key
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBERNETES_SERVICEACCOUNT_TOKEN_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          volumeMounts:
            - name: admin
              mountPath: /var/run/secrets/agentos-openfga
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: admin
          secret:
            secretName: openfga-admin
            defaultMode: 256
