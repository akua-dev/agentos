apiVersion: v1
kind: Service
metadata:
  name: openfga
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: agentos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openfga
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 8081
      targetPort: grpc
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: openfga-bootstrap
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentos
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: openfga
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
