apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openfga-bootstrap
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentos
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - openfga-deployment
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openfga-bootstrap
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: agentos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openfga-bootstrap
subjects:
  - kind: ServiceAccount
    name: openfga-bootstrap
