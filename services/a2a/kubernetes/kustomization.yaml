apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentos
resources:
  - serviceaccount.yaml
  - rbac.yaml
  - service.yaml
  - deployment.yaml
  - poddisruptionbudget.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: agentos-a2a-targets
    files:
      - targets.json=targets.json
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: agentos-a2a
        app.kubernetes.io/component: protocol-adapter
        app.kubernetes.io/part-of: agentos
